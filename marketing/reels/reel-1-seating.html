<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reel 1 — Drag & Drop Seating</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a0a0a 0%, #2d1015 50%, #1a0a0a 100%);
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

.top-text {
  position: absolute; top: 8%; left: 0; right: 0; text-align: center;
  padding: 0 24px;
  animation: fadeSlideDown 0.6s ease-out forwards;
  opacity: 0;
}
.top-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 8vw, 64px); color: #fff; margin-bottom: 8px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.top-text p {
  font-size: clamp(14px, 4vw, 26px); color: rgba(255,255,255,0.7); font-weight: 500;
}

.canvas-area {
  position: absolute; top: 22%; left: 5%; right: 5%; bottom: 18%;
  background: rgba(255,255,255,0.03);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  overflow: hidden;
  animation: fadeIn 0.4s 0.3s ease-out forwards;
  opacity: 0;
}

.table {
  position: absolute;
  width: clamp(60px, 18vw, 140px); height: clamp(60px, 18vw, 140px);
  border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(4px);
}
.table .label { font-size: clamp(9px, 2.5vw, 16px); font-weight: 700; color: #fff; }
.table .count { font-size: clamp(7px, 1.8vw, 12px); color: rgba(255,255,255,0.6); margin-top: 2px; }

.table.t1 { top: 6%; left: 5%; }
.table.t2 { top: 6%; left: 37%; }
.table.t3 { top: 6%; left: 69%; }
.table.t4 { top: 36%; left: 5%; }
.table.t5 { top: 36%; left: 37%; }
.table.t6 { top: 36%; left: 69%; }
.table.t7 { top: 66%; left: 20%; }
.table.t8 { top: 66%; left: 55%; }

.guest {
  position: absolute;
  background: linear-gradient(135deg, #be123c, #9f1239);
  color: #fff; font-size: clamp(11px, 3vw, 14px); font-weight: 600;
  padding: 8px 14px; border-radius: 20px;
  box-shadow: 0 8px 32px rgba(190, 18, 60, 0.4);
  white-space: nowrap;
  animation: dragGuest 6s 1s ease-in-out infinite;
  opacity: 0;
}

@keyframes dragGuest {
  0% { top: 88%; left: 5%; opacity: 1; transform: scale(1); }
  5% { top: 86%; left: 5%; opacity: 1; transform: scale(1.1); }
  40% { top: 42%; left: 40%; opacity: 1; transform: scale(1.05); }
  45% { top: 42%; left: 40%; opacity: 1; transform: scale(1); }
  50% { top: 42%; left: 40%; opacity: 0; transform: scale(0.8); }
  100% { top: 42%; left: 40%; opacity: 0; transform: scale(0.8); }
}

.table.t5 { animation: receiveGuest 6s 1s ease-in-out infinite; }
@keyframes receiveGuest {
  0%, 39% { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
  40%, 50% { border-color: #be123c; background: rgba(190, 18, 60, 0.15); box-shadow: 0 0 40px rgba(190, 18, 60, 0.3); }
  55%, 100% { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
}

.guest2 {
  animation: dragGuest2 6s 3.5s ease-in-out infinite;
  background: linear-gradient(135deg, #d97706, #b45309);
  box-shadow: 0 8px 32px rgba(217, 119, 6, 0.4);
}
@keyframes dragGuest2 {
  0% { top: 92%; left: 5%; opacity: 1; transform: scale(1); }
  5% { top: 90%; left: 5%; opacity: 1; transform: scale(1.1); }
  40% { top: 12%; left: 72%; opacity: 1; transform: scale(1.05); }
  45% { top: 12%; left: 72%; opacity: 1; transform: scale(1); }
  50% { top: 12%; left: 72%; opacity: 0; transform: scale(0.8); }
  100% { top: 12%; left: 72%; opacity: 0; transform: scale(0.8); }
}

.table.t3 { animation: receiveGuest2 6s 3.5s ease-in-out infinite; }
@keyframes receiveGuest2 {
  0%, 39% { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
  40%, 50% { border-color: #d97706; background: rgba(217, 119, 6, 0.15); box-shadow: 0 0 40px rgba(217, 119, 6, 0.3); }
  55%, 100% { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
}

.bottom-cta {
  position: absolute; bottom: 5%; left: 0; right: 0; text-align: center;
  animation: fadeSlideUp 0.6s 0.8s ease-out forwards;
  opacity: 0;
}
.bottom-cta .brand {
  font-size: clamp(28px, 7vw, 48px); font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #fda4af 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.bottom-cta p { font-size: clamp(12px, 3.5vw, 20px); color: rgba(255,255,255,0.6); }

@keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.glow {
  position: absolute; width: 50vw; height: 50vw; border-radius: 50%;
  background: radial-gradient(circle, rgba(190, 18, 60, 0.15), transparent 70%);
  animation: pulse 4s ease-in-out infinite; pointer-events: none;
}
.glow.g1 { top: 20%; left: -15%; }
.glow.g2 { bottom: 15%; right: -15%; animation-delay: 2s; }
@keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="top-text">
    <h1>Drag. Drop. Done.</h1>
    <p>Seat 300+ guests in minutes</p>
  </div>

  <div class="canvas-area">
    <div class="table t1"><span class="label">T1</span><span class="count">8/10</span></div>
    <div class="table t2"><span class="label">T2</span><span class="count">10/10</span></div>
    <div class="table t3"><span class="label">T3</span><span class="count">7/10</span></div>
    <div class="table t4"><span class="label">T4</span><span class="count">9/10</span></div>
    <div class="table t5"><span class="label">T5</span><span class="count">6/10</span></div>
    <div class="table t6"><span class="label">T6</span><span class="count">10/10</span></div>
    <div class="table t7"><span class="label">T7</span><span class="count">5/10</span></div>
    <div class="table t8"><span class="label">T8</span><span class="count">8/10</span></div>

    <div class="guest">Patel Family (4)</div>
    <div class="guest guest2">Aisha Khan +1</div>
  </div>

  <div class="bottom-cta">
    <div class="brand">Phera</div>
    <p>Built for Indian weddings</p>
  </div>
</body>
</html>
