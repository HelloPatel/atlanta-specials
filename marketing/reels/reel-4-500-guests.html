<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reel 4 — 500+ Guests, No Problem</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

.top-text {
  position: absolute; top: 8%; left: 0; right: 0; text-align: center;
  padding: 0 24px;
  animation: fadeSlideDown 0.6s ease-out forwards;
  opacity: 0;
}
.top-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px, 7vw, 52px); color: #fff; margin-bottom: 6px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.top-text p {
  font-size: clamp(13px, 3.5vw, 22px); color: rgba(255,255,255,0.6); font-weight: 500;
}

.counter-area {
  position: absolute; top: 28%; left: 0; right: 0; text-align: center;
  animation: fadeIn 0.5s 0.5s ease-out forwards;
  opacity: 0;
}
.counter {
  font-size: clamp(80px, 22vw, 180px); font-weight: 900;
  background: linear-gradient(135deg, #a78bfa 0%, #f472b6 50%, #fb923c 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1;
  animation: countUp 4s 1s ease-out forwards;
  filter: drop-shadow(0 10px 40px rgba(167, 139, 250, 0.3));
}
@keyframes countUp {
  0% { transform: scale(0.8); opacity: 0.5; }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}
.counter-label {
  font-size: clamp(16px, 4vw, 28px); color: rgba(255,255,255,0.6);
  font-weight: 600; margin-top: 8px; letter-spacing: 2px;
}

.dots-container {
  position: absolute; top: 50%; left: 5%; right: 5%; bottom: 28%;
  overflow: hidden;
}
.dot {
  position: absolute;
  width: clamp(6px, 1.8vw, 10px); height: clamp(6px, 1.8vw, 10px);
  border-radius: 50%;
  opacity: 0;
  animation: floatDot 3s ease-in-out infinite;
}
@keyframes floatDot {
  0% { opacity: 0; transform: translateY(100%) scale(0); }
  20% { opacity: 0.8; transform: translateY(50%) scale(1); }
  80% { opacity: 0.6; transform: translateY(-50%) scale(0.9); }
  100% { opacity: 0; transform: translateY(-100%) scale(0); }
}

.stats-row {
  position: absolute; bottom: 18%; left: 5%; right: 5%;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  animation: fadeSlideUp 0.6s 1.5s ease-out forwards;
  opacity: 0;
}
.stat {
  text-align: center;
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 14px 8px;
}
.stat .num {
  font-size: clamp(20px, 5.5vw, 36px); font-weight: 800; color: #fff;
}
.stat .lbl {
  font-size: clamp(9px, 2.2vw, 13px); color: rgba(255,255,255,0.5);
  margin-top: 4px; font-weight: 500;
}

.bottom-cta {
  position: absolute; bottom: 4%; left: 0; right: 0; text-align: center;
  animation: fadeSlideUp 0.6s 2s ease-out forwards;
  opacity: 0;
}
.bottom-cta .brand {
  font-size: clamp(26px, 7vw, 44px); font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.bottom-cta p { font-size: clamp(11px, 3vw, 18px); color: rgba(255,255,255,0.5); }

@keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.glow { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; pointer-events: none; }
.glow.g1 { top: 15%; left: -20%; background: radial-gradient(circle, rgba(167, 139, 250, 0.12), transparent 70%); animation: pulse 4s ease-in-out infinite; }
.glow.g2 { bottom: 25%; right: -20%; background: radial-gradient(circle, rgba(244, 114, 182, 0.1), transparent 70%); animation: pulse 4s 2s ease-in-out infinite; }
.glow.g3 { top: 45%; left: 20%; background: radial-gradient(circle, rgba(251, 146, 60, 0.08), transparent 70%); animation: pulse 4s 3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>

  <div class="top-text">
    <h1>Built for Scale</h1>
    <p>Because Indian weddings are big</p>
  </div>

  <div class="counter-area">
    <div class="counter">500+</div>
    <div class="counter-label">GUESTS MANAGED</div>
  </div>

  <div class="dots-container">
    <script>
      // Generate floating dots
      const colors = ['#a78bfa','#f472b6','#fb923c','#34d399','#60a5fa','#fbbf24'];
      const container = document.querySelector('.dots-container');
      for (let i = 0; i < 60; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 100 + '%';
        dot.style.background = colors[Math.floor(Math.random() * colors.length)];
        dot.style.animationDelay = (Math.random() * 3) + 's';
        dot.style.animationDuration = (2 + Math.random() * 2) + 's';
        container.appendChild(dot);
      }
    </script>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="num">50+</div><div class="lbl">Tables</div></div>
    <div class="stat"><div class="num">6+</div><div class="lbl">Events</div></div>
    <div class="stat"><div class="num">3</div><div class="lbl">Languages</div></div>
  </div>

  <div class="bottom-cta">
    <div class="brand">Phera</div>
    <p>Handle any size wedding</p>
  </div>
</body>
</html>
