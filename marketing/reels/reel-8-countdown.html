<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reel 8 — Live Countdown</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #0a0a0a 0%, #1a0a15 50%, #0a0a0a 100%);
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

.top-text {
  position: absolute; top: 8%; left: 0; right: 0; text-align: center;
  padding: 0 24px;
  animation: fadeSlideDown 0.6s ease-out forwards;
  opacity: 0;
}
.top-text .couple {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 7vw, 52px); color: #fff;
  font-weight: 600; margin-bottom: 4px;
}
.top-text .date {
  font-size: clamp(13px, 3.5vw, 20px); color: rgba(255,255,255,0.5); font-weight: 500;
}

.countdown {
  position: absolute; top: 28%; left: 8%; right: 8%;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 2vw, 16px);
  animation: fadeIn 0.5s 0.5s ease-out forwards;
  opacity: 0;
}
.countdown .box {
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: clamp(14px, 4vw, 24px) 8px;
  text-align: center;
  backdrop-filter: blur(6px);
}
.countdown .box .num {
  font-size: clamp(32px, 9vw, 64px); font-weight: 900;
  background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.countdown .box .lbl {
  font-size: clamp(9px, 2.2vw, 13px); color: rgba(255,255,255,0.5);
  text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;
}

/* Ticking animation on seconds */
.countdown .box:last-child .num {
  animation: tick 1s ease-in-out infinite;
}
@keyframes tick {
  0%, 50% { transform: scale(1); }
  25% { transform: scale(1.05); }
}

.phone-preview {
  position: absolute; top: 50%; left: 10%; right: 10%; bottom: 20%;
  background: #1a1a2e;
  border-radius: 30px;
  border: 3px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  overflow: hidden;
  animation: phoneSlide 0.8s 1s ease-out forwards;
  opacity: 0; transform: translateY(30px);
}
.phone-preview .screen {
  height: 100%;
  background: linear-gradient(180deg, #2d1028 0%, #1a0a15 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px;
}
.phone-preview .screen .mini-couple {
  font-family: 'Playfair Display', serif;
  font-size: clamp(18px, 4.5vw, 28px); color: #fff;
  margin-bottom: 12px;
}
.phone-preview .screen .mini-countdown {
  display: flex; gap: 6px;
}
.phone-preview .screen .mini-box {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 8px 6px;
  text-align: center;
  min-width: clamp(36px, 10vw, 48px);
}
.phone-preview .screen .mini-box .n {
  font-size: clamp(14px, 3.5vw, 20px); font-weight: 800; color: #fff;
}
.phone-preview .screen .mini-box .l {
  font-size: clamp(7px, 1.8vw, 9px); color: rgba(255,255,255,0.5);
  text-transform: uppercase;
}
.phone-preview .screen .rsvp-btn {
  margin-top: 16px;
  background: rgba(255,255,255,0.15);
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 8px 20px;
  font-size: clamp(11px, 2.8vw, 13px);
  color: #fff; font-weight: 600;
  animation: pulseBorder 2s ease-in-out infinite;
}
@keyframes pulseBorder {
  0%, 100% { border-color: rgba(255,255,255,0.3); }
  50% { border-color: rgba(255,255,255,0.6); box-shadow: 0 0 20px rgba(255,255,255,0.1); }
}

.bottom-cta {
  position: absolute; bottom: 4%; left: 0; right: 0; text-align: center;
  animation: fadeSlideUp 0.6s 1.5s ease-out forwards;
  opacity: 0;
}
.bottom-cta .brand {
  font-size: clamp(26px, 7vw, 44px); font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #fda4af 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.bottom-cta p { font-size: clamp(11px, 3vw, 18px); color: rgba(255,255,255,0.5); }

@keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes phoneSlide { to { opacity: 1; transform: translateY(0); } }

.glow { position: absolute; width: 50vw; height: 50vw; border-radius: 50%; pointer-events: none; }
.glow.g1 { top: 20%; left: -15%; background: radial-gradient(circle, rgba(190, 18, 60, 0.1), transparent 70%); animation: pulse 4s ease-in-out infinite; }
.glow.g2 { bottom: 25%; right: -15%; background: radial-gradient(circle, rgba(244, 114, 182, 0.08), transparent 70%); animation: pulse 4s 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="top-text">
    <div class="couple">Priya & Arjun</div>
    <div class="date">Saturday, March 15th 2025</div>
  </div>

  <div class="countdown">
    <div class="box"><div class="num">47</div><div class="lbl">Days</div></div>
    <div class="box"><div class="num">12</div><div class="lbl">Hours</div></div>
    <div class="box"><div class="num">34</div><div class="lbl">Min</div></div>
    <div class="box"><div class="num">08</div><div class="lbl">Sec</div></div>
  </div>

  <div class="phone-preview">
    <div class="screen">
      <div class="mini-couple">Priya & Arjun</div>
      <div class="mini-countdown">
        <div class="mini-box"><div class="n">47</div><div class="l">Days</div></div>
        <div class="mini-box"><div class="n">12</div><div class="l">Hrs</div></div>
        <div class="mini-box"><div class="n">34</div><div class="l">Min</div></div>
        <div class="mini-box"><div class="n">08</div><div class="l">Sec</div></div>
      </div>
      <div class="rsvp-btn">RSVP Now →</div>
    </div>
  </div>

  <div class="bottom-cta">
    <div class="brand">Phera</div>
    <p>Live countdown on your wedding site</p>
  </div>
</body>
</html>
